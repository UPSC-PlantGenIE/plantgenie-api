#cloud-config
package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - nginx
  - libnginx-mod-stream
  - nfs-kernel-server

users:
  - name: ${server_username}
    lock_passwd: true
    shell: /bin/bash
    ssh-authorized-keys:
      - ${public_ssh_key}
    sudo:
      - ALL=(ALL) NOPASSWD:ALL

mounts:
  - [ "LABEL=shared", /srv/shared, "ext4", "defaults,nofail", "0", "2" ]

write_files:
  - path: /etc/exports
    content: /srv/shared ${internal_subnet_cidr}(rw,sync,no_subtree_check)
    append: true

  - path: /usr/local/sbin/prepare-shared-volume
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      if ! blkid /dev/sdb >/dev/null 2>&1; then
          mkfs.ext4 -L shared /dev/sdb
      fi

      mkdir -p /srv/shared
      mount -a
      chown ${server_username}:${server_username} /srv/shared

  - path: /etc/systemd/system/shared-volume.service
    content: |
      [Unit]
      Description=Prepare and mount the shared data volume
      BindsTo=dev-sdb.device
      After=dev-sdb.device
      Wants=nfs-server.service
      Before=nfs-server.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/prepare-shared-volume

      [Install]
      WantedBy=dev-sdb.device

  - path: /etc/systemd/system/nfs-server.service.d/shared-volume.conf
    content: |
      [Unit]
      Requires=shared-volume.service
      After=shared-volume.service

  - path: /etc/nginx/stream.conf.d/neo4j-bolt.conf
    content: |
      server {
          listen 7687;
          proxy_pass ${neo4j_internal_ip}:7687;
      }

  - path: /etc/nginx/nginx.conf
    content: |
      include /etc/nginx/modules-enabled/*.conf;

      worker_processes 1;

      events {
          worker_connections 1024;
      }

      stream {
          include /etc/nginx/stream.conf.d/*.conf;
      }

      http {
          include      mime.types;
          default_type application/octet-stream;
          sendfile     on;
          keepalive_timeout 65;

          server {
              listen 80;
              server_name _;

              location /api/ {
                  proxy_pass http://${application_internal_ip}:8000/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /rabbitmq/ {
                  proxy_pass http://${rabbitmq_internal_ip}:15672/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
      }

  - path: /etc/ssh/sshd_config
    content: |
      Port 22
      Protocol 2
      HostKey /etc/ssh/ssh_host_rsa_key
      HostKey /etc/ssh/ssh_host_ecdsa_key
      HostKey /etc/ssh/ssh_host_ed25519_key
      SyslogFacility AUTH
      LogLevel INFO
      LoginGraceTime 120
      PermitRootLogin no
      PermitEmptyPasswords no
      PermitUserEnvironment yes
      PasswordAuthentication no
      StrictModes yes
      DebianBanner no
      PubkeyAuthentication yes
      IgnoreRhosts yes
      HostbasedAuthentication no
      ChallengeResponseAuthentication no
      X11Forwarding no
      PrintMotd no
      PrintLastLog yes
      TCPKeepAlive yes
      AcceptEnv LANG LC_*
      Subsystem sftp /usr/lib/openssh/sftp-server
      UsePAM yes
      MaxAuthTries 3
      MaxStartups 2:30:10
      AllowAgentForwarding no
      AllowUsers ${server_username}

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 7687/tcp comment 'Neo4j Bolt'
  - ufw allow proto tcp from ${internal_subnet_cidr} to any port 2049 comment 'NFS'
  - ufw enable
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl enable nginx
  - systemctl start nginx
  - systemctl daemon-reload
  - systemctl enable shared-volume
