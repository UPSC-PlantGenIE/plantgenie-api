[project]
name = "knowledge-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jamie McCann", email = "jamie.mccann@umu.se" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.2.0",
    "jinja2>=3.1.6",
    "neo4j>=6.2.0",
    "shared",
    "structlog>=25.5.0",
    "typer>=0.15.2",
]

[project.scripts]
knowledge-builder = "knowledge_builder:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }
