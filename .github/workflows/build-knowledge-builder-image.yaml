name: Build and Push Knowledge-Builder Image

on:
  push:
    branches:
      - main
      - feature/knowledge-builder
    paths:
      - "packages/knowledge-builder/**"
      - "packages/shared/**"
      - "packages/snakemake-storage-plugin-swift/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-knowledge-builder-image.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          repo_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ghcr.io/$repo_name/knowledge-builder:latest \
            -t ghcr.io/$repo_name/knowledge-builder:${{ github.sha }} \
            -f packages/knowledge-builder/Dockerfile .

      - name: Push Docker image to GHCR
        run: |
          repo_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$repo_name/knowledge-builder:latest
          docker push ghcr.io/$repo_name/knowledge-builder:${{ github.sha }}
