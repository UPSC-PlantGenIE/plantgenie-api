name: Build and Release Frontend

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable
        working-directory: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ui/package.json
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: yarn build

      - name: Zip build artifacts
        run: zip -r plantgenie-ui-${{ github.ref_name }}.zip dist

      - name: Upload zipped build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plantgenie-ui
          path: ui/plantgenie-ui-${{ github.ref_name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: plantgenie-ui
          path: .

      - name: Create a release
        uses: softprops/action-gh-release@v2
        with:
          files: plantgenie-ui-${{ github.ref_name }}.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: "New release of plantgenie-ui"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
